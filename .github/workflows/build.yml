name: Build Mobile APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev automake curl

      - name: Bundle FFmpeg Engine
        run: |
          mkdir -p libs/arm64-v8a
          # Download the engine from a highly stable, active repository
          curl -L -o ffmpeg.zip "https://github.com/Tyrrrz/FFmpegBin/releases/latest/download/ffmpeg-android-arm64.zip"
          # Extract only the ffmpeg executable and disguise it as an Android library
          unzip ffmpeg.zip ffmpeg
          mv ffmpeg libs/arm64-v8a/libffmpeg.so
          chmod +x libs/arm64-v8a/libffmpeg.so

      - name: Install Python Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer "cython<3.0" virtualenv

      - name: Compile APK
        run: yes | buildozer android debug

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: YTClipperPro-Android-APK
          path: bin/*.apk
